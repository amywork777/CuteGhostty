name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  packaging-and-themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n build.sh install.sh cute-greeting.sh scripts/validate-themes.sh
      - name: Validate themes
        run: bash scripts/validate-themes.sh
      - name: Test packaging with mocked macOS tools
        run: python3 scripts/test-build.py -v
